<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Week Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="house-scoreboard">
        <!-- House 1 scoreboard -->
        <div class="house">
            <h2>House 1</h2>
            <p>Points: <span id="house1-points">0</span></p>
            <button class="add-points">+10</button>
            <button class="subtract-points">-10</button>
            <input id="house1-number" type="number">
            <button class="award-button">Award</button>
            <p id="house1-leader"></p>
            <button class="reset-button">Reset</button>
        </div>

        <!-- House 2 scoreboard -->
        <div class="house">
            <h2>House 2</h2>
            <p>Points: <span id="house2-points">0</span></p>
            <button class="add-points">+10</button>
            <button class="subtract-points">-10</button>
            <input id="house2-number" type="number">
            <button class="award-button">Award</button>
            <p id="house2-leader"></p>
            <button class="reset-button">Reset</button>
        </div>

        <!-- House 3 scoreboard -->
        <div class="house">
            <h2>House 3</h2>
            <p>Points: <span id="house3-points">0</span></p>
            <button class="add-points">+10</button>
            <button class="subtract-points">-10</button>
            <input id="house3-number" type="number">
            <button class="award-button">Award</button>
            <p id="house3-leader"></p>
            <button class="reset-button">Reset</button>
        </div>

        <!-- House 4 scoreboard -->
        <div class="house">
            <h2>House 4</h2>
            <p>Points: <span id="house4-points">0</span></p>
            <button class="add-points">+10</button>
            <button class="subtract-points">-10</button>
            <input id="house4-number" type="number">
            <button class="award-button">Award</button>
            <p id="house4-leader"></p>
            <button class="reset-button">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
