<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Week Scoreboard</title>
    <style>
        /* Make the scoreboard look neat and clean */
        #scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Style the house div elements */
        #house1, #house2, #house3, #house4 {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin: 20px;
        }

        /* Style the buttons */
        #plus10, #minus10, #award, #reset {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Style the award button */
        #award {
            background-color: #ccc;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Spirit Week Scoreboard</h1>
    <div id="scoreboard">
        <!-- House 1 -->
        <div id="house1" style="background-color: #eee;">
            <p id="point1">0</p>
            <button id="plus10">+10</button>
            <button id="minus10">-10</button>
            <input id="point2" type="number" placeholder="Enter points">
            <button id="award">Award</button>
            <button id="reset">Reset</button>
        </div>
        <!-- House 2 -->
        <div id="house2" style="background-color: #eee;">
            <p id="point1">0</p>
            <button id="plus10">+10</button>
            <button id="minus10">-10</button>
            <input id="point2" type="number" placeholder="Enter points">
            <button id="award">Award</button>
            <button id="reset">Reset</button>
        </div>
        <!-- House 3 -->
        <div id="house3" style="background-color: #eee;">
            <p id="point1">0</p>
            <button id="plus10">+10</button>
            <button id="minus10">-10</button>
            <input id="point2" type="number" placeholder="Enter points">
            <button id="award">Award</button>
            <button id="reset">Reset</button>
        </div>
        <!-- House 4 -->
        <div id="house4" style="background-color: #eee;">
            <p id="point1">0</p>
            <button id="plus10">+10</button>
            <button id="minus10">-10</button>
            <input id="point2" type="number" placeholder="Enter points">
            <button id="award">Award</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        let points = {
            house1: 0,
            house2: 0,
            house3: 0,
            house4: 0
        };

        document.getElementById("plus10").addEventListener("click", function() {
            if (points.house1 >= 0) {
                points.house1 += 10;
                document.getElementById("point1").innerHTML = points.house1;
                document.getElementById("point2").value = "";
            } else {
                alert("You can't add points below 0!");
            }
        });

        document.getElementById("minus10").addEventListener("click", function() {
            if (points.house1 >= 0) {
                points.house1 -= 10;
                document.getElementById("point1").innerHTML = points.house1;
                document.getElementById("point2").value = "";
            } else {
                alert("You can't subtract points below 0!");
            }
        });

        document.getElementById("award").addEventListener("click", function() {
            var input = prompt("Enter your number of points:");
            if (isNaN(input) || input < 1) {
                alert("Please enter a whole number greater than 0!");
            } else {
                points.house1 += parseInt(input);
                document.getElementById("point1").value = points.house1;
                document.getElementById("point2").value = "";
            }
        });

        document.getElementById("reset").addEventListener("click", function() {
            points.house1 = 0;
            document.getElementById("point1").value = points.house1;
            document.getElementById("point2").value = "";
        });

        let leader = Math.max(...Object.values(points));
        document.getElementById("leader").innerHTML = leader + " is the Leader";
    </script>
</body>
</html>
