<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Cup</title>

  <style>
    /* Section: the whole page. Parchment background and text that is never smaller than 18px. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f3e9d0;
      color: #2a1d0e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.4;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Section: the title at the top. It grows on a big projector screen. */
    h1 {
      margin: 4px 0 0;
      text-align: center;
      font-size: clamp(30px, 5vw, 60px);
      line-height: 1.1;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 4px 0 16px;
      text-align: center;
      font-style: italic;
    }

    /* Section: one card per house. The stripe on the left is the house's main colour. */
    .house {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
      margin-bottom: 12px;
      padding: 12px;
      background: #fffaf0;
      border: 1px solid #c9b78f;
      border-left-width: 12px;
      border-radius: 8px;
    }

    .house-info {
      flex: 1 1 280px;
      min-width: 0;
    }

    /* Section: the house name, the Leader or Tied word, and the points number. */
    .house-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      margin-bottom: 8px;
    }

    .house-name {
      margin: 0;
      font-size: clamp(24px, 3vw, 44px);
      line-height: 1.1;
    }

    .status {
      padding: 2px 10px;
      border: 2px solid #2a1d0e;
      border-radius: 999px;
      font-size: clamp(18px, 1.8vw, 28px);
      font-weight: bold;
    }

    .status:empty {
      display: none;
    }

    .status.leader {
      background: #d3a625;
    }

    .points {
      margin-left: auto;
      font-size: clamp(30px, 4vw, 56px);
      font-weight: bold;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* Section: the bar. The outline is the house's second colour, the filling is its main colour. */
    .bar-track {
      height: clamp(26px, 3vw, 44px);
      background: #ffffff;
      border: 3px solid #2a1d0e;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0;
      height: 100%;
      transition: width 0.4s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .bar-fill {
        transition: none;
      }
    }

    /* Section: the buttons and the number box. They are big enough to tap on a phone. */
    .house-controls {
      flex: 0 1 400px;
      min-width: 0;
    }

    .controls,
    .award {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .award {
      flex: 1 1 190px;
    }

    button,
    input {
      min-height: 48px;
      border: 2px solid #2a1d0e;
      border-radius: 6px;
      font-family: inherit;
      font-size: 20px;
    }

    button {
      padding: 0 16px;
      background: #fffaf0;
      color: #2a1d0e;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #f0dfb4;
    }

    button:active {
      background: #e2cb8f;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #1d5fbf;
      outline-offset: 2px;
    }

    .award input {
      flex: 1 1 90px;
      width: 90px;
      min-width: 0;
      padding: 0 10px;
      background: #ffffff;
      color: #2a1d0e;
    }

    .award-button {
      background: #2a1d0e;
      color: #fffaf0;
    }

    .award-button:hover {
      background: #4a3520;
    }

    .award-button:active {
      background: #5f462c;
    }

    /* Section: messages on the page. We never use pop-up alerts. */
    .message {
      margin: 8px 0 0;
      padding: 6px 10px;
      background: #fde9e7;
      border-left: 6px solid #a3120a;
      color: #5c0a05;
    }

    .message:empty {
      display: none;
    }

    /* Section: the Reset button at the bottom, kept away from the house buttons. */
    .reset-area {
      margin-top: 20px;
      text-align: center;
    }

    .reset-button {
      border-color: #a3120a;
      color: #a3120a;
    }

    .reset-button:hover {
      background: #fde9e7;
    }
  </style>
</head>

<body>
  <!-- Section: the page. The house cards are added inside "houses" by the script below. -->
  <main>
    <h1>House Cup</h1>
    <p class="subtitle">Spirit Week house points</p>

    <div id="houses"></div>

    <div class="reset-area">
      <button type="button" class="reset-button" id="reset-button">Reset</button>
      <p class="message" id="page-message" role="status"></p>
    </div>
  </main>

  <!-- Section: the scoring logic (adding points, the leader, the award rules) lives in scoreboard.js. -->
  <script src="scoreboard.js"></script>

  <script>
    // ----- Section: things the page remembers -----

    // The name the scores are saved under in this browser.
    const STORAGE_KEY = "houseCupScores";

    // The parts of the page we need to reach again later.
    const housesArea = document.getElementById("houses");
    const resetButton = document.getElementById("reset-button");
    const pageMessage = document.getElementById("page-message");

    // One entry per house, holding the parts of its card that change.
    const cards = [];

    // The current points, one number per house, loaded from the last visit.
    let scores = loadScores();

    // ----- Section: saving and loading, so points survive a page reload -----

    // Reads the saved scores from this browser, or starts at 0 if there are none.
    function loadScores() {
      try {
        return scoresFromText(localStorage.getItem(STORAGE_KEY));
      } catch (error) {
        return startingScores();
      }
    }

    // Saves the scores in this browser, and says so on the page if that fails.
    function saveScores() {
      try {
        localStorage.setItem(STORAGE_KEY, scoresToText(scores));
        pageMessage.textContent = "";
      } catch (error) {
        pageMessage.textContent = "This browser could not save the points, so they will be lost if the page reloads.";
      }
    }

    // ----- Section: building the house cards -----

    // Builds the card for one house, with its colours, and connects its buttons.
    function buildHouseCard(house, houseIndex) {
      const card = document.createElement("section");
      card.className = "house";
      card.style.borderLeftColor = house.main;
      card.setAttribute("aria-label", house.name);
      card.innerHTML =
        '<div class="house-info">' +
        '  <div class="house-top">' +
        '    <h2 class="house-name">' + house.name + '</h2>' +
        '    <span class="status"></span>' +
        '    <span class="points">0</span>' +
        '  </div>' +
        '  <div class="bar-track"><div class="bar-fill"></div></div>' +
        '</div>' +
        '<div class="house-controls">' +
        '  <div class="controls">' +
        '    <button type="button" class="plus-button">+10</button>' +
        '    <button type="button" class="minus-button">-10</button>' +
        '    <form class="award" novalidate>' +
        '      <input type="text" inputmode="numeric" autocomplete="off" placeholder="1 to 50"' +
        '        aria-label="Points to award to ' + house.name + '">' +
        '      <button type="submit" class="award-button">Award</button>' +
        '    </form>' +
        '  </div>' +
        '  <p class="message" role="status"></p>' +
        '</div>';

      card.querySelector(".bar-track").style.borderColor = house.second;
      card.querySelector(".bar-fill").style.backgroundColor = house.main;

      card.querySelector(".plus-button").addEventListener("click", function () {
        changePoints(houseIndex, 10);
      });
      card.querySelector(".minus-button").addEventListener("click", function () {
        changePoints(houseIndex, -10);
      });
      card.querySelector(".award").addEventListener("submit", function (event) {
        event.preventDefault();
        awardTypedPoints(houseIndex);
      });

      housesArea.appendChild(card);
      cards.push({
        status: card.querySelector(".status"),
        points: card.querySelector(".points"),
        barFill: card.querySelector(".bar-fill"),
        awardBox: card.querySelector(".award input"),
        message: card.querySelector(".message")
      });
    }

    // ----- Section: showing the scores on the page -----

    // Updates every card to show the current points, bar length and Leader or Tied word.
    function showScores() {
      for (let houseIndex = 0; houseIndex < cards.length; houseIndex = houseIndex + 1) {
        const card = cards[houseIndex];
        const word = statusWord(scores, houseIndex);
        card.points.textContent = scores[houseIndex];
        card.barFill.style.width = barPercent(scores, houseIndex) + "%";
        card.status.textContent = word;
        card.status.classList.toggle("leader", word === "Leader");
      }
    }

    // Removes the message under every house.
    function clearMessages() {
      for (const card of cards) {
        card.message.textContent = "";
      }
    }

    // ----- Section: what the buttons do -----

    // Adds points to one house (or takes them away), then saves and shows the result.
    function changePoints(houseIndex, amount) {
      scores = addPoints(scores, houseIndex, amount);
      clearMessages();
      saveScores();
      showScores();
    }

    // Awards the number typed in a house's box, or shows a message if it is not allowed.
    function awardTypedPoints(houseIndex) {
      const card = cards[houseIndex];
      const problem = checkAward(card.awardBox.value);
      if (problem !== "") {
        clearMessages();
        card.message.textContent = problem;
        return;
      }
      changePoints(houseIndex, Number(card.awardBox.value));
      card.awardBox.value = "";
    }

    // Sets every house back to 0 and empties the number boxes.
    function resetEverything() {
      scores = resetScores();
      for (const card of cards) {
        card.awardBox.value = "";
      }
      clearMessages();
      saveScores();
      showScores();
    }

    // ----- Section: starting the page -----

    HOUSES.forEach(buildHouseCard);
    resetButton.addEventListener("click", resetEverything);
    showScores();
  </script>
</body>
</html>
